  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body class="leitor">
<div class="app">
  <div class="ferramentas">
    <button id="bFonte" title="Tamanho da letra"><svg viewBox="0 0 24 24"><path d="M2 17 6.5 5h2L13 17h-2l-1-3H5l-1 3H2zm3.6-5h3.8L7.5 6.6 5.6 12zM17 9c2 0 3 1 3 3v5h-1.7l-.1-.8c-.5.6-1.3 1-2.2 1-1.4 0-2.4-.9-2.4-2.2 0-1.6 1.4-2.4 4.4-2.4V12c0-.8-.4-1.3-1.3-1.3-.8 0-1.4.4-1.6 1.1l-1.5-.5C14.9 9.8 15.8 9 17 9zm1.3 4.6c-1.9 0-2.6.4-2.6 1.1 0 .5.4.8 1 .8 1 0 1.6-.6 1.6-1.6v-.3zM1 20h22v1.5H1z"/></svg></button>
  <button id="bTexto" title="Mostrar/ocultar texto" class="on"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 1 9.4 6.6l1.6-.9-.5 5-4.3-2.6 1.4-.8A8 8 0 0 0 4.3 9.3L2.4 8.7A10 10 0 0 1 12 2zm-9.6 10.3 4.3 2.6-1.4.8a8 8 0 0 0 14.4-.4l1.9.6A10 10 0 0 1 2.6 15.4l-1.6.9.5-5zM8 7h8v2h-3v8h-2V9H8z"/></svg></button>
    <button id="bNoite" title="Modo noite"><svg viewBox="0 0 24 24"><path d="M14 2a9 9 0 1 0 8 13A8 8 0 0 1 14 2zM4 4l.6 1.4L6 6l-1.4.6L4 8l-.6-1.4L2 6l1.4-.6zm3 6 .4.9.9.4-.9.4L7 12.6l-.4-.9-.9-.4.9-.4z"/></svg></button>
    <button id="bMusica" title="Música de fundo" hidden><svg viewBox="0 0 24 24"><path d="M9 3v11.6A3.5 3.5 0 1 0 11 18V8h7v4.6a3.5 3.5 0 1 0 2 3.2V3z"/></svg></button>
    <button id="bAmbiente" title="Sons de fundo" hidden><svg viewBox="0 0 24 24"><path d="M2 15c2 0 2-1.5 4-1.5S8 15 10 15s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5v2c-2 0-2 1.5-4 1.5s-2-1.5-4-1.5-2 1.5-4 1.5-2-1.5-4-1.5S4 17 2 17zm0 4c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5v2c-2 0-2 1.5-4 1.5s-2-1.5-4-1.5-2 1.5-4 1.5-2-1.5-4-1.5S4 21 2 21zM17 3c-3 0-6 2.5-6 6.5 1.5-1.5 3-2 4.5-2-1.5 1-2.6 2.6-3 4.5h1.6c.6-2.5 2.5-4 4.9-4.5-.6 2.5-2.6 4.5-5.5 4.5 3.5 1 7.5-1.5 7.5-5.5 0-1.3-.5-2.5-1-3.5H17z"/></svg></button>
    <button id="bBaixar" class="baixar" title="Baixar para ler sem internet"><svg viewBox="0 0 24 24" id="icoBaixar"></svg></button>
    <button id="bAuto" title="Virar páginas sozinho"><svg viewBox="0 0 24 24"><path d="M3 5v14l8-7zm9 0v14l8-7z"/></svg></button>
    <button class="menu" id="bMenu" title="Estante"><svg viewBox="0 0 24 24"><path d="M3 5h18v2.5H3zm0 5.75h18v2.5H3zM3 16.5h18V19H3z"/></svg></button>
  </div>

  <div class="texto" id="texto"></div>
  <div class="ilustracao" id="ilustracao"></div>
  <div class="barra-prog"><b id="prog"></b></div>

  <div class="controles">
    <button id="bFechar" title="Fechar"><svg viewBox="0 0 24 24"><path d="M5.6 3.5 12 9.9l6.4-6.4 2.1 2.1-6.4 6.4 6.4 6.4-2.1 2.1-6.4-6.4-6.4 6.4-2.1-2.1 6.4-6.4-6.4-6.4z"/></svg></button>
    <button id="bAnt" title="Página anterior"><svg viewBox="0 0 24 24"><path d="M17 3.5v17c0 .8-.9 1.3-1.6.8L4 13a1.2 1.2 0 0 1 0-2L15.4 2.7c.7-.5 1.6 0 1.6.8z"/></svg></button>
    <span class="contador" id="contador"></span>
    <button id="bProx" title="Próxima página"><svg viewBox="0 0 24 24"><path d="M7 3.5v17c0 .8.9 1.3 1.6.8L20 13a1.2 1.2 0 0 0 0-2L8.6 2.7C7.9 2.2 7 2.7 7 3.5z"/></svg></button>
    <button id="bSom" title="Narração"><svg viewBox="0 0 24 24" id="icoSom"></svg></button>
  </div>
</div>
<audio id="narracao" preload="auto"></audio>
<audio id="musica" loop preload="none"></audio>
<audio id="ambiente" loop preload="auto"></audio>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SOM_ON = '<path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>';
const SOM_OFF = '<path d="M3 9v6h4l5 5V4L7 9zm13.6 3 2.7-2.7 1.4 1.4-2.7 2.7 2.7 2.7-1.4 1.4-2.7-2.7-2.7 2.7-1.4-1.4 2.7-2.7-2.7-2.7 1.4-1.4z"/>';

const ICO_BAIXAR = '<path d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16 6.3 10.3l1.4-1.4L11 12.2zM4 18h16v2H4z"/>';
const ICO_BAIXADO = '<path d="M9.5 16.2 4.8 11.5l1.4-1.4 3.3 3.3 8.3-8.3 1.4 1.4zM4 18h16v2H4z"/>';
const prefs = Object.assign({ fs: 34, texto: true, noite: false, som: true, auto: false, musica: true, ambiente: true },
  JSON.parse(localStorage.getItem('prefsLeitor') || '{}'));
const salvarPrefs = () => localStorage.setItem('prefsLeitor', JSON.stringify(prefs));

const params = new URLSearchParams(location.search);
const id = params.get('id');
const audio = $('#narracao');
const musica = $('#musica');
const ambiente = $('#ambiente');
let livro, pagina = 0, palavras = [], mapa = [], timerAuto;

const total = () => livro.pages.length + 1;          // capa + páginas
const ehFim = () => pagina >= total();

function normal(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, ''); }

// liga as palavras exibidas às palavras narradas (o texto narrado pode ter tags/variações)
function alinhar(exibidas, faladas) {
  const res = new Array(exibidas.length).fill(-1);
  let j = 0;
  for (let i = 0; i < exibidas.length; i++) {
    const a = normal(exibidas[i]);
    if (!a) continue;
    for (let k = j; k < Math.min(j + 4, faladas.length); k++) {
      if (normal(faladas[k].w) === a) { res[i] = k; j = k + 1; break; }
    }
    if (res[i] === -1 && exibidas.length === faladas.length) { res[i] = i; j = i + 1; }
  }
  return res;
}

function aplicarPrefs() {
  document.documentElement.style.setProperty('--fs', `${prefs.fs}px`);
  if (livro) requestAnimationFrame(ajustarFonte);
  document.body.classList.toggle('noite', prefs.noite);
  $('#bNoite').classList.toggle('on', prefs.noite);
  $('#bTexto').classList.toggle('on', prefs.texto);
  $('#bAuto').classList.toggle('on', prefs.auto);
  $('#bMusica').classList.toggle('on', prefs.musica);
  $('#bAmbiente').classList.toggle('on', prefs.ambiente);
  $('#texto').classList.toggle('oculto', !prefs.texto);
  $('#icoSom').innerHTML = prefs.som ? SOM_ON : SOM_OFF;
  audio.muted = !prefs.som;
}

// diminui a letra até o texto caber acima da ilustração (nunca aumenta além da escolha)
function ajustarFonte() {
  const t = $('#texto');
  let fs = prefs.fs;
  t.style.setProperty('--fs-fit', `${fs}px`);
  while (fs > 16 && t.scrollHeight > t.clientHeight + 1) {
    fs -= 2;
    t.style.setProperty('--fs-fit', `${fs}px`);
  }
}
addEventListener('resize', () => livro && ajustarFonte());
document.fonts?.ready.then(() => livro && ajustarFonte());

// movimentos de câmera (Ken Burns). Escala >= 1.12 para nunca mostrar a borda.
const MOVIMENTOS = [
  ['scale(1.02)', 'scale(1.16)'],                                         // aproxima
  ['scale(1.16) translate(-4%, 0)', 'scale(1.16) translate(4%, 0)'],      // passeia p/ direita
  ['scale(1.18) translate(3%, 2%)', 'scale(1.04)'],                        // afasta
  ['scale(1.16) translate(0, 4%)', 'scale(1.16) translate(0, -3%)'],      // sobe
  ['scale(1.16) translate(4%, 0)', 'scale(1.16) translate(-4%, 0)'],      // passeia p/ esquerda
  ['scale(1.04) translate(0, 0)', 'scale(1.18) translate(-3%, 3%)'],      // aproxima no canto
];
function imgMovendo(url, n, segundos) {
  if (!url) return '';
  const [de, para] = MOVIMENTOS[n % MOVIMENTOS.length];
  const dur = Math.max(9, Math.min(30, (segundos || 8) + 3));
  return `<img src="${url}" alt="" style="--kb-from:${de};--kb-to:${para};--kb-dur:${dur}s">`;
}

function render() {
  clearTimeout(timerAuto);
  audio.pause();
  const t = $('#texto');
  const il = $('#ilustracao');
  palavras = []; mapa = [];

  if (ehFim()) {
    t.innerHTML = `<div class="fim"><h2>Fim!</h2><p>Gostou da história?</p>
      <button id="bDeNovo">Ler de novo</button><button id="bEstante">Voltar à estante</button></div>`;
    il.innerHTML = imgMovendo(livro.cover.url, 2, 12);
    $('#bDeNovo').onclick = () => irPara(0);
    $('#bEstante').onclick = () => (location.href = '/');
    $('#contador').textContent = `${total()}/${total()}`;
  } else if (pagina === 0) {
    t.innerHTML = `<div><h2>${esc(livro.title)}</h2></div>`;
    il.innerHTML = imgMovendo(livro.cover.url, 0, 12);
    $('#contador').textContent = `1/${total()}`;
  } else {
    const p = livro.pages[pagina - 1];
    const exibidas = p.text.split(/\s+/).filter(Boolean);
    t.innerHTML = `<p>${exibidas.map((w, i) => `<span class="w" data-i="${i}">${esc(w)}</span>`).join(' ')}</p>`;
    palavras = [...t.querySelectorAll('.w')];
    mapa = alinhar(exibidas, p.words || []);
    il.innerHTML = imgMovendo(p.imageUrl, pagina, p.words?.at(-1)?.end);
    $('#contador').textContent = `${pagina + 1}/${total()}`;
    if (p.audioUrl) {
      audio.src = p.audioUrl;
      audio.currentTime = 0;
      audio.play().catch(() => {}); // pode ser bloqueado até o primeiro toque
    } else if (prefs.auto) agendarAuto(4000);
  }
  ambienteDesejado = !ehFim() && pagina > 0 ? livro.pages[pagina - 1].ambienceUrl || '' : '';
  if (pagina === 0 && prefs.auto) agendarAuto(3000);
  ajustarFonte();
  $('#prog').style.width = `${Math.min(100, (pagina / total()) * 100)}%`;
  $('#bAnt').disabled = pagina === 0;
  $('#bProx').disabled = ehFim();
  document.title = livro.title;

  const prog = JSON.parse(localStorage.getItem('progresso') || '{}');
  if (ehFim()) delete prog[livro.id];
  else prog[livro.id] = { page: pagina, at: Date.now() };
  localStorage.setItem('progresso', JSON.stringify(prog));

  // pré-carrega a próxima ilustração
  const prox = livro.pages[pagina];
  if (prox?.imageUrl) new Image().src = prox.imageUrl;
}

function agendarAuto(ms) {
  clearTimeout(timerAuto);
  if (prefs.auto && !ehFim()) timerAuto = setTimeout(() => irPara(pagina + 1), ms);
}

function irPara(n) {
  pagina = Math.max(0, Math.min(total(), n));
  render();
}

// destaque palavra por palavra
function destacar() {
  const p = livro.pages[pagina - 1];
  if (!p?.words?.length) return;
  const tempo = audio.currentTime;
  palavras.forEach((el, i) => {
    const w = p.words[mapa[i]];
    el.classList.toggle('atual', !!w && tempo >= w.start && tempo < w.end + 0.08);
  });
  if (!audio.paused) requestAnimationFrame(destacar);
}
audio.addEventListener('play', () => requestAnimationFrame(destacar));
audio.addEventListener('ended', () => { palavras.forEach((el) => el.classList.remove('atual')); agendarAuto(1200); });

// toque em uma palavra: ouvir dali
document.addEventListener('click', (e) => {
  const w = e.target.closest('.w');
  if (!w) return;
  const k = mapa[+w.dataset.i];
  const p = livro.pages[pagina - 1];
  if (k >= 0 && p?.words?.[k] && audio.src) { audio.currentTime = p.words[k].start; audio.play(); }
});

$('#bProx').onclick = () => irPara(pagina + 1);
$('#bAnt').onclick = () => irPara(pagina - 1);
$('#bFechar').onclick = $('#bMenu').onclick = () => (location.href = '/');
$('#bSom').onclick = () => {
  prefs.som = !prefs.som; salvarPrefs(); aplicarPrefs();
  if (prefs.som && audio.src && pagina > 0 && !ehFim()) { audio.currentTime = 0; audio.play().catch(() => {}); }
};
$('#bFonte').onclick = () => { prefs.fs = prefs.fs >= 46 ? 26 : prefs.fs + 6; salvarPrefs(); aplicarPrefs(); };
$('#bTexto').onclick = () => { prefs.texto = !prefs.texto; salvarPrefs(); aplicarPrefs(); };
$('#bNoite').onclick = () => { prefs.noite = !prefs.noite; salvarPrefs(); aplicarPrefs(); };
$('#bAuto').onclick = () => { prefs.auto = !prefs.auto; salvarPrefs(); aplicarPrefs(); if (prefs.auto && audio.paused) agendarAuto(1500); else clearTimeout(timerAuto); };
$('#bMusica').onclick = () => { prefs.musica = !prefs.musica; salvarPrefs(); aplicarPrefs(); destravarAudio(); };
$('#bAmbiente').onclick = () => { prefs.ambiente = !prefs.ambiente; salvarPrefs(); aplicarPrefs(); destravarAudio(); };

// ---- trilha sonora + som de fundo ----
// O volume passa por Web Audio (no iPhone o volume do <audio> não pode ser alterado).
// A narração "abaixa" a trilha e o som de fundo; o som de fundo troca com fade entre páginas.
let ctx = null, ganhoMusica = null, ganhoAmbiente = null, ambienteDesejado = '';
const vol = { musica: 0, ambiente: 0 };
function destravarAudio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
      ctx = new AC();
      const ligar = (el) => { el.volume = 1; const g = ctx.createGain(); g.gain.value = 0; ctx.createMediaElementSource(el).connect(g).connect(ctx.destination); return g; };
      ganhoMusica = ligar(musica);
      ganhoAmbiente = ligar(ambiente);
    }
  }
  ctx?.resume?.().catch(() => {});
  // no iPhone o primeiro play de cada <audio> precisa acontecer dentro de um toque
  if (!ambiente.getAttribute('src')) {
    const u = ambienteDesejado || livro?.pages.find((p) => p.ambienceUrl)?.ambienceUrl;
    if (u) ambiente.src = u; // começa mudo; o mixer troca/pausa depois
  }
  if (prefs.musica && musica.getAttribute('src') && musica.paused) musica.play().catch(() => {});
  if (prefs.ambiente && ambiente.getAttribute('src') && ambiente.paused) ambiente.play().catch(() => {});
}
// qualquer interação libera o áudio: clique, toque (no Android o toque só conta no touchend) e teclado
for (const t of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  document.addEventListener(t, () => destravarAudio(), { capture: true, passive: true });
}
// Os sons de fundo da ElevenLabs vêm com volumes muito diferentes (alguns quase mudos):
// mede cada arquivo uma vez e calcula um fator para deixá-los num volume parecido, sem distorcer.
const fatorSom = new Map();
async function medirSom(url) {
  if (!url || !ctx || fatorSom.has(url)) return;
  fatorSom.set(url, 1);
  try {
    const buf = await ctx.decodeAudioData(await (await fetch(url)).arrayBuffer());
    let soma = 0, pico = 0, n = 0;
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < d.length; i += 4) { soma += d[i] * d[i]; pico = Math.max(pico, Math.abs(d[i])); n++; }
    }
    const rms = Math.sqrt(soma / Math.max(n, 1));
    if (rms > 0) fatorSom.set(url, Math.max(0.5, Math.min(0.07 / rms, 0.9 / (pico * 0.6 || 1), 10)));
  } catch { /* fica 1 */ }
}
function aplicarVolume(el, ganho, v) {
  if (ganho) ganho.gain.value = v; else el.volume = Math.min(1, v);
}
function mixer() {
  if (!livro) return;
  // se o áudio ficou suspenso (ex.: virou a página sozinho), retoma assim que o navegador permitir
  if (ctx && ctx.state !== 'running' && navigator.userActivation?.hasBeenActive && !document.hidden) ctx.resume().catch(() => {});
  const narrando = !audio.paused && !audio.muted;
  // trilha: fade nas pontas para o loop não dar "pulo"
  let alvoM = 0;
  if (prefs.musica && musica.src) {
    const d = musica.duration || 0, t = musica.currentTime || 0;
    const borda = d ? Math.max(0, Math.min(1, t / 1.5, (d - t) / 1.5)) : 1;
    alvoM = (narrando ? 0.12 : 0.28) * borda;
  }
  // som de fundo: se a página pede outro som, abaixa, troca e sobe
  const atual = ambiente.getAttribute('src') || '';
  let alvoA = prefs.ambiente && ambienteDesejado ? (narrando ? 0.4 : 0.6) : 0;
  if (ambienteDesejado !== atual) {
    alvoA = 0;
    if (vol.ambiente < 0.03) {
      if (ambienteDesejado) { ambiente.src = ambienteDesejado; ambiente.play().catch(() => {}); }
      else { ambiente.pause(); ambiente.removeAttribute('src'); }
    }
  }
  vol.musica += (alvoM - vol.musica) * 0.2;
  vol.ambiente += (alvoA - vol.ambiente) * 0.2;
  aplicarVolume(musica, ganhoMusica, vol.musica);
  medirSom(ambienteDesejado);
  aplicarVolume(ambiente, ganhoAmbiente, vol.ambiente * (fatorSom.get(atual) || 1));
  if (prefs.musica && musica.src && musica.paused && ctx?.state === 'running' && !document.hidden) musica.play().catch(() => {});
  if (prefs.ambiente && ambiente.src && ambiente.paused && ctx?.state === 'running' && !document.hidden) ambiente.play().catch(() => {});
  if (!prefs.musica && vol.musica < 0.01 && !musica.paused) musica.pause();
  if (!prefs.ambiente && vol.ambiente < 0.01 && !ambiente.paused) ambiente.pause();
}
setInterval(mixer, 100);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { musica.pause(); ambiente.pause(); }
});

// ---- baixar para ler offline ----
function iconeBaixar() {
  const ok = !!Offline.baixados()[livro.id];
  $('#icoBaixar').innerHTML = ok ? ICO_BAIXADO : ICO_BAIXAR;
  $('#bBaixar').classList.toggle('ok', ok);
  $('#bBaixar').title = ok ? 'Baixado: funciona sem internet (toque para remover)' : 'Baixar para ler sem internet';
}
function toast(msg, ms = 2500) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.append(t);
  setTimeout(() => t.remove(), ms);
  return t;
}
$('#bBaixar').onclick = async () => {
  if (Offline.baixados()[livro.id]) {
    if (!confirm('Remover este livro do aparelho? Ele não vai mais abrir sem internet.')) return;
    await Offline.remover(livro.id); iconeBaixar(); toast('Livro removido do aparelho'); return;
  }
  if (!navigator.onLine) return toast('Precisa de internet para baixar');
  const b = $('#bBaixar');
  b.disabled = true;
  const aviso = toast('Baixando…', 600000);
  try {
    await Offline.baixar(livro.id, (f, t) => { aviso.textContent = `Baixando… ${Math.round((f / Math.max(t, 1)) * 100)}%`; });
    aviso.remove(); toast('Pronto! Este livro funciona sem internet ✓');
  } catch (e) { aviso.remove(); toast(e.message, 4000); }
  b.disabled = false;
  iconeBaixar();
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') irPara(pagina + 1);
  if (e.key === 'ArrowLeft') irPara(pagina - 1);
  if (e.key === ' ') { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
});

// deslizar para virar a página
let x0 = null;
document.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 60) irPara(pagina + (dx < 0 ? 1 : -1));
  x0 = null;
});

// primeiro toque libera o áudio no celular
document.addEventListener('pointerdown', () => {
  if (audio.src && audio.paused && audio.currentTime === 0 && pagina > 0 && !ehFim()) audio.play().catch(() => {});
}, { once: true });

(async () => {
  const token = localStorage.getItem('adminToken') || '';
  const r = await fetch(`/api/books/${encodeURIComponent(id)}`, { headers: token ? { 'x-admin-token': token } : {} });
  if (!r.ok) { document.body.innerHTML = '<p class="vazio" style="color:#a8705a">Livro não encontrado. <a href="/">Voltar</a></p>'; return; }
  livro = await r.json();
  Offline.atualizarSeMudou(livro);
  iconeBaixar();
  if (livro.music?.url) musica.src = livro.music.url;
  else if (await fetch('/musica.mp3', { method: 'HEAD' }).then((x) => x.ok).catch(() => false)) musica.src = '/musica.mp3';
  $('#bMusica').hidden = !musica.getAttribute('src');
  $('#bAmbiente').hidden = !livro.pages.some((p) => p.ambienceUrl);
  aplicarPrefs();
  const salvo = JSON.parse(localStorage.getItem('progresso') || '{}')[livro.id];
  irPara(params.has('p') ? Number(params.get('p')) : salvo?.page || 0);
})();
</script>
</body>
</html>
