<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4caf50">
  <title>Lendo…</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="leitor">
<div class="app">
  <div class="ferramentas">
    <button id="bFonte" title="Tamanho da letra"><svg viewBox="0 0 24 24"><path d="M2 17 6.5 5h2L13 17h-2l-1-3H5l-1 3H2zm3.6-5h3.8L7.5 6.6 5.6 12zM17 9c2 0 3 1 3 3v5h-1.7l-.1-.8c-.5.6-1.3 1-2.2 1-1.4 0-2.4-.9-2.4-2.2 0-1.6 1.4-2.4 4.4-2.4V12c0-.8-.4-1.3-1.3-1.3-.8 0-1.4.4-1.6 1.1l-1.5-.5C14.9 9.8 15.8 9 17 9zm1.3 4.6c-1.9 0-2.6.4-2.6 1.1 0 .5.4.8 1 .8 1 0 1.6-.6 1.6-1.6v-.3zM1 20h22v1.5H1z"/></svg></button>
  <button id="bTexto" title="Mostrar/ocultar texto" class="on"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 1 9.4 6.6l1.6-.9-.5 5-4.3-2.6 1.4-.8A8 8 0 0 0 4.3 9.3L2.4 8.7A10 10 0 0 1 12 2zm-9.6 10.3 4.3 2.6-1.4.8a8 8 0 0 0 14.4-.4l1.9.6A10 10 0 0 1 2.6 15.4l-1.6.9.5-5zM8 7h8v2h-3v8h-2V9H8z"/></svg></button>
    <button id="bNoite" title="Modo noite"><svg viewBox="0 0 24 24"><path d="M14 2a9 9 0 1 0 8 13A8 8 0 0 1 14 2zM4 4l.6 1.4L6 6l-1.4.6L4 8l-.6-1.4L2 6l1.4-.6zm3 6 .4.9.9.4-.9.4L7 12.6l-.4-.9-.9-.4.9-.4z"/></svg></button>
    <button id="bMusica" title="Música de fundo" hidden><svg viewBox="0 0 24 24"><path d="M9 3v11.6A3.5 3.5 0 1 0 11 18V8h7v4.6a3.5 3.5 0 1 0 2 3.2V3z"/></svg></button>
    <button id="bAuto" title="Virar páginas sozinho"><svg viewBox="0 0 24 24"><path d="M3 5v14l8-7zm9 0v14l8-7z"/></svg></button>
    <button class="menu" id="bMenu" title="Estante"><svg viewBox="0 0 24 24"><path d="M3 5h18v2.5H3zm0 5.75h18v2.5H3zM3 16.5h18V19H3z"/></svg></button>
  </div>

  <div class="texto" id="texto"></div>
  <div class="ilustracao" id="ilustracao"></div>
  <div class="barra-prog"><b id="prog"></b></div>

  <div class="controles">
    <button id="bFechar" title="Fechar"><svg viewBox="0 0 24 24"><path d="M5.6 3.5 12 9.9l6.4-6.4 2.1 2.1-6.4 6.4 6.4 6.4-2.1 2.1-6.4-6.4-6.4 6.4-2.1-2.1 6.4-6.4-6.4-6.4z"/></svg></button>
    <button id="bAnt" title="Página anterior"><svg viewBox="0 0 24 24"><path d="M17 3.5v17c0 .8-.9 1.3-1.6.8L4 13a1.2 1.2 0 0 1 0-2L15.4 2.7c.7-.5 1.6 0 1.6.8z"/></svg></button>
    <span class="contador" id="contador"></span>
    <button id="bProx" title="Próxima página"><svg viewBox="0 0 24 24"><path d="M7 3.5v17c0 .8.9 1.3 1.6.8L20 13a1.2 1.2 0 0 0 0-2L8.6 2.7C7.9 2.2 7 2.7 7 3.5z"/></svg></button>
    <button id="bSom" title="Narração"><svg viewBox="0 0 24 24" id="icoSom"></svg></button>
  </div>
</div>
<audio id="narracao" preload="auto"></audio>
<audio id="musica" loop preload="none"></audio>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SOM_ON = '<path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>';
const SOM_OFF = '<path d="M3 9v6h4l5 5V4L7 9zm13.6 3 2.7-2.7 1.4 1.4-2.7 2.7 2.7 2.7-1.4 1.4-2.7-2.7-2.7 2.7-1.4-1.4 2.7-2.7-2.7-2.7 1.4-1.4z"/>';

const prefs = Object.assign({ fs: 34, texto: true, noite: false, som: true, auto: false, musica: false },
  JSON.parse(localStorage.getItem('prefsLeitor') || '{}'));
const salvarPrefs = () => localStorage.setItem('prefsLeitor', JSON.stringify(prefs));

const params = new URLSearchParams(location.search);
const id = params.get('id');
const audio = $('#narracao');
const musica = $('#musica');
let livro, pagina = 0, palavras = [], mapa = [], timerAuto;

const total = () => livro.pages.length + 1;          // capa + páginas
const ehFim = () => pagina >= total();

function normal(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, ''); }

// liga as palavras exibidas às palavras narradas (o texto narrado pode ter tags/variações)
function alinhar(exibidas, faladas) {
  const res = new Array(exibidas.length).fill(-1);
  let j = 0;
  for (let i = 0; i < exibidas.length; i++) {
    const a = normal(exibidas[i]);
    if (!a) continue;
    for (let k = j; k < Math.min(j + 4, faladas.length); k++) {
      if (normal(faladas[k].w) === a) { res[i] = k; j = k + 1; break; }
    }
    if (res[i] === -1 && exibidas.length === faladas.length) { res[i] = i; j = i + 1; }
  }
  return res;
}

function aplicarPrefs() {
  document.documentElement.style.setProperty('--fs', `${prefs.fs}px`);
  document.body.classList.toggle('noite', prefs.noite);
  $('#bNoite').classList.toggle('on', prefs.noite);
  $('#bTexto').classList.toggle('on', prefs.texto);
  $('#bAuto').classList.toggle('on', prefs.auto);
  $('#bMusica').classList.toggle('on', prefs.musica);
  $('#texto').classList.toggle('oculto', !prefs.texto);
  $('#icoSom').innerHTML = prefs.som ? SOM_ON : SOM_OFF;
  audio.muted = !prefs.som;
}

function render() {
  clearTimeout(timerAuto);
  audio.pause();
  const t = $('#texto');
  const il = $('#ilustracao');
  palavras = []; mapa = [];

  if (ehFim()) {
    t.innerHTML = `<div class="fim"><h2>Fim!</h2><p>Gostou da história?</p>
      <button id="bDeNovo">Ler de novo</button><button id="bEstante">Voltar à estante</button></div>`;
    il.innerHTML = livro.cover.url ? `<img src="${livro.cover.url}" alt="">` : '';
    $('#bDeNovo').onclick = () => irPara(0);
    $('#bEstante').onclick = () => (location.href = '/');
    $('#contador').textContent = `${total()}/${total()}`;
  } else if (pagina === 0) {
    t.innerHTML = `<div><h2>${esc(livro.title)}</h2></div>`;
    il.innerHTML = livro.cover.url ? `<img src="${livro.cover.url}" alt="">` : '';
    $('#contador').textContent = `1/${total()}`;
  } else {
    const p = livro.pages[pagina - 1];
    const exibidas = p.text.split(/\s+/).filter(Boolean);
    t.innerHTML = `<p>${exibidas.map((w, i) => `<span class="w" data-i="${i}">${esc(w)}</span>`).join(' ')}</p>`;
    palavras = [...t.querySelectorAll('.w')];
    mapa = alinhar(exibidas, p.words || []);
    il.innerHTML = p.imageUrl ? `<img src="${p.imageUrl}" alt="">` : '';
    $('#contador').textContent = `${pagina + 1}/${total()}`;
    if (p.audioUrl) {
      audio.src = p.audioUrl;
      audio.currentTime = 0;
      audio.play().catch(() => {}); // pode ser bloqueado até o primeiro toque
    } else if (prefs.auto) agendarAuto(4000);
  }
  if (pagina === 0 && prefs.auto) agendarAuto(3000);
  $('#prog').style.width = `${Math.min(100, (pagina / total()) * 100)}%`;
  $('#bAnt').disabled = pagina === 0;
  $('#bProx').disabled = ehFim();
  document.title = livro.title;

  const prog = JSON.parse(localStorage.getItem('progresso') || '{}');
  if (ehFim()) delete prog[livro.id];
  else prog[livro.id] = { page: pagina, at: Date.now() };
  localStorage.setItem('progresso', JSON.stringify(prog));

  // pré-carrega a próxima ilustração
  const prox = livro.pages[pagina];
  if (prox?.imageUrl) new Image().src = prox.imageUrl;
}

function agendarAuto(ms) {
  clearTimeout(timerAuto);
  if (prefs.auto && !ehFim()) timerAuto = setTimeout(() => irPara(pagina + 1), ms);
}

function irPara(n) {
  pagina = Math.max(0, Math.min(total(), n));
  render();
}

// destaque palavra por palavra
function destacar() {
  const p = livro.pages[pagina - 1];
  if (!p?.words?.length) return;
  const tempo = audio.currentTime;
  palavras.forEach((el, i) => {
    const w = p.words[mapa[i]];
    el.classList.toggle('atual', !!w && tempo >= w.start && tempo < w.end + 0.08);
  });
  if (!audio.paused) requestAnimationFrame(destacar);
}
audio.addEventListener('play', () => requestAnimationFrame(destacar));
audio.addEventListener('ended', () => { palavras.forEach((el) => el.classList.remove('atual')); agendarAuto(1200); });

// toque em uma palavra: ouvir dali
document.addEventListener('click', (e) => {
  const w = e.target.closest('.w');
  if (!w) return;
  const k = mapa[+w.dataset.i];
  const p = livro.pages[pagina - 1];
  if (k >= 0 && p?.words?.[k] && audio.src) { audio.currentTime = p.words[k].start; audio.play(); }
});

$('#bProx').onclick = () => irPara(pagina + 1);
$('#bAnt').onclick = () => irPara(pagina - 1);
$('#bFechar').onclick = $('#bMenu').onclick = () => (location.href = '/');
$('#bSom').onclick = () => {
  prefs.som = !prefs.som; salvarPrefs(); aplicarPrefs();
  if (prefs.som && audio.src && pagina > 0 && !ehFim()) { audio.currentTime = 0; audio.play().catch(() => {}); }
};
$('#bFonte').onclick = () => { prefs.fs = prefs.fs >= 46 ? 26 : prefs.fs + 6; salvarPrefs(); aplicarPrefs(); };
$('#bTexto').onclick = () => { prefs.texto = !prefs.texto; salvarPrefs(); aplicarPrefs(); };
$('#bNoite').onclick = () => { prefs.noite = !prefs.noite; salvarPrefs(); aplicarPrefs(); };
$('#bAuto').onclick = () => { prefs.auto = !prefs.auto; salvarPrefs(); aplicarPrefs(); if (prefs.auto && audio.paused) agendarAuto(1500); else clearTimeout(timerAuto); };
$('#bMusica').onclick = () => {
  prefs.musica = !prefs.musica; salvarPrefs(); aplicarPrefs();
  if (prefs.musica) musica.play().catch(() => {}); else musica.pause();
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') irPara(pagina + 1);
  if (e.key === 'ArrowLeft') irPara(pagina - 1);
  if (e.key === ' ') { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
});

// deslizar para virar a página
let x0 = null;
document.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 60) irPara(pagina + (dx < 0 ? 1 : -1));
  x0 = null;
});

// primeiro toque libera o áudio no celular
document.addEventListener('pointerdown', () => {
  if (prefs.musica && musica.paused && musica.src) musica.play().catch(() => {});
  if (audio.src && audio.paused && audio.currentTime === 0 && pagina > 0 && !ehFim()) audio.play().catch(() => {});
}, { once: true });

(async () => {
  const token = localStorage.getItem('adminToken') || '';
  const r = await fetch(`/api/books/${encodeURIComponent(id)}`, { headers: token ? { 'x-admin-token': token } : {} });
  if (!r.ok) { document.body.innerHTML = '<p class="vazio" style="color:#a8705a">Livro não encontrado. <a href="/">Voltar</a></p>'; return; }
  livro = await r.json();
  musica.volume = 0.18;
  const temMusica = await fetch('/musica.mp3', { method: 'HEAD' }).then((x) => x.ok).catch(() => false);
  if (temMusica) { musica.src = '/musica.mp3'; $('#bMusica').hidden = false; }
  aplicarPrefs();
  const salvo = JSON.parse(localStorage.getItem('progresso') || '{}')[livro.id];
  irPara(params.has('p') ? Number(params.get('p')) : salvo?.page || 0);
})();
</script>
</body>
</html>
